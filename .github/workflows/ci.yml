# Continuous integration for the openclaw-portfolio-optimiser repository.
#
# Runs on every push to main and every pull request. Two jobs in parallel:
# tests (full pytest suite) and security (detect-secrets check).
# Both must pass for the workflow to succeed.
#
# This complements the local pre-commit hooks: pre-commit catches issues
# before a commit lands, CI catches issues that slipped past (e.g. a
# contributor who didn't run 'pre-commit install').

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: pytest (Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run pytest
        run: pytest -v --tb=short

  security:
    name: detect-secrets baseline check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install detect-secrets
        run: pip install "detect-secrets==1.5.0"

      - name: Check baseline against tracked files
        # `detect-secrets-hook` only fails when it finds NEW secrets
        # (candidates not already accounted for in the baseline). It
        # does not flag legitimate baseline metadata changes like a
        # regenerated timestamp. This is the right strictness for CI:
        # catch new findings, ignore housekeeping.
        run: |
          git ls-files | xargs detect-secrets-hook --baseline .secrets.baseline
